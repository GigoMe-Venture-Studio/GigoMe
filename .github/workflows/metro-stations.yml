# Fetches Milan's metro stations (M1 to M5) from the City of Milan's open
# data (dataset DS535, ds535_tpl_metrofermate.csv, Comune di Milano,
# CC BY 4.0) on GitHub's servers and pushes a data migration to a new branch,
# data/metro-stations, together with the metro map drawn on every map
# (public/metro/milan-metro.geojson, built from DS535 and DS533 by
# scripts/build-metro-map.mjs). Started by hand only: Actions > Metro
# stations > Run workflow.
#
# It fails, and pushes nothing, unless every check in
# scripts/fetch-metro-stations.mjs passes: 115 to 130 stations, at least 15
# per line, no station twice or under two names, and Duomo, Porta Venezia,
# Garibaldi FS and Centrale FS with the right lines in the right place. The
# run's summary shows the count per line and every station.
#
# It then compares the result with what's already on main
# (scripts/metro-changed.mjs: the newest station migration, ignoring its
# header comment with the date; and the map file). If nothing changed, it
# finishes green with "No changes, nothing pushed". Only real changes are
# pushed. Nothing reaches the database until a pull request from
# data/metro-stations is merged.
name: Metro stations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metro-stations

jobs:
  fetch:
    name: Fetch the stations and push the migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch the stations from the City of Milan
        run: node scripts/fetch-metro-stations.mjs

      - name: Build the metro map (lines and stations)
        run: node scripts/build-metro-map.mjs

      - name: Compare with what's on main
        id: compare
        run: |
          new=$(git ls-files --others --exclude-standard 'supabase/migrations/*_metro_stations_data.sql')
          if [ "$(echo "$new" | grep -c .)" != 1 ]; then
            echo "::error::Expected exactly one new station migration, found: $new"
            exit 1
          fi
          echo "file=$new" >> "$GITHUB_OUTPUT"
          node scripts/metro-changed.mjs "$new"
          if git diff --quiet -- public/metro/milan-metro.geojson; then
            echo "Map file unchanged."; echo "map=false" >> "$GITHUB_OUTPUT"
          else
            echo "Map file changed."; echo "map=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes, nothing pushed
        if: steps.compare.outputs.changed == 'false' && steps.compare.outputs.map == 'false'
        run: |
          echo "No changes, nothing pushed: the stations and the map are the same as on main."
          {
            echo ''
            echo '**No changes, nothing pushed.** The stations (ignoring the date in the header) and the metro map are the same as on main.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if data/metro-stations already exists
        if: steps.compare.outputs.changed == 'true' || steps.compare.outputs.map == 'true'
        run: |
          if git ls-remote --exit-code --heads origin data/metro-stations > /dev/null; then
            msg="Something changed, but the branch data/metro-stations already exists. Merge or close its pull request, delete the branch (Code > Branches), then run this again."
            echo "::error::$msg"
            echo "**Stopped:** $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Push the changes to data/metro-stations
        if: steps.compare.outputs.changed == 'true' || steps.compare.outputs.map == 'true'
        env:
          NEW_FILE: ${{ steps.compare.outputs.file }}
          STATIONS_CHANGED: ${{ steps.compare.outputs.changed }}
          MAP_CHANGED: ${{ steps.compare.outputs.map }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch -c data/metro-stations
          # Only what changed: the migration if the stations did, the map if it did.
          if [ "$STATIONS_CHANGED" = true ]; then git add "$NEW_FILE"; fi
          if [ "$MAP_CHANGED" = true ]; then git add public/metro/milan-metro.geojson; fi
          git commit -m 'Metro stations (M1 to M5) from the City of Milan' \
            -m "Generated by the Metro stations workflow (run $GITHUB_RUN_ID). Data: Comune di Milano, CC BY 4.0 (dataset DS535)."
          git push origin data/metro-stations
          {
            echo ''
            echo "Stations changed: $STATIONS_CHANGED, map changed: $MAP_CHANGED."
            echo "Pushed to **data/metro-stations**. Open its pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...data/metro-stations?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
