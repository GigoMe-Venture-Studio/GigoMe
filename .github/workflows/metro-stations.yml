# Fetches Milan's metro stations (M1 to M5) from OpenStreetMap on GitHub's
# servers and pushes a data migration to a new branch, data/metro-stations.
# Started by hand only: Actions > Metro stations > Run workflow.
#
# It fails, and pushes nothing, unless it finds between 100 and 130 stations
# with some on every line. The run's summary shows the count per line and
# every station. Nothing reaches the database until a pull request from
# data/metro-stations is merged into main.
name: Metro stations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metro-stations

jobs:
  fetch:
    name: Fetch the stations and push the migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Stop if data/metro-stations already exists
        run: |
          if git ls-remote --exit-code --heads origin data/metro-stations > /dev/null; then
            msg="The branch data/metro-stations already exists. Merge or close its pull request, delete the branch (Code > Branches), then run this again."
            echo "::error::$msg"
            echo "**Stopped:** $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the stations from OpenStreetMap
        run: node scripts/fetch-metro-stations.mjs

      - name: Push the migration to data/metro-stations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch -c data/metro-stations
          git add supabase/migrations/*_metro_stations_data.sql
          git commit -m 'Metro stations (M1 to M5) from OpenStreetMap' \
            -m "Generated by the Metro stations workflow (run $GITHUB_RUN_ID). Data © OpenStreetMap contributors, ODbL."
          git push origin data/metro-stations
          {
            echo ''
            echo "Pushed to **data/metro-stations**. Open its pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...data/metro-stations?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
