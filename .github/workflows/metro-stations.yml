# Fetches Milan's metro stations (M1 to M5) from the City of Milan's open
# data (dataset DS535, ds535_tpl_metrofermate.csv, Comune di Milano,
# CC BY 4.0) on GitHub's servers and pushes a data migration to a new branch,
# data/metro-stations, together with the metro map drawn on every map
# (public/metro/milan-metro.geojson, built from DS535 and DS533 by
# scripts/build-metro-map.mjs). Started by hand only: Actions > Metro
# stations > Run workflow.
#
# It fails, and pushes nothing, unless every check in
# scripts/fetch-metro-stations.mjs passes: 115 to 130 stations, at least 15
# per line, no station twice or under two names, and Duomo, Porta Venezia,
# Garibaldi FS and Centrale FS with the right lines in the right place. The
# run's summary shows the count per line and every station. Nothing reaches
# the database until a pull request from data/metro-stations is merged.
name: Metro stations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metro-stations

jobs:
  fetch:
    name: Fetch the stations and push the migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Stop if data/metro-stations already exists
        run: |
          if git ls-remote --exit-code --heads origin data/metro-stations > /dev/null; then
            msg="The branch data/metro-stations already exists. Merge or close its pull request, delete the branch (Code > Branches), then run this again."
            echo "::error::$msg"
            echo "**Stopped:** $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the stations from the City of Milan
        run: node scripts/fetch-metro-stations.mjs

      - name: Build the metro map (lines and stations)
        run: node scripts/build-metro-map.mjs

      - name: Push the migration to data/metro-stations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch -c data/metro-stations
          git add supabase/migrations/*_metro_stations_data.sql public/metro/milan-metro.geojson
          git commit -m 'Metro stations (M1 to M5) from the City of Milan' \
            -m "Generated by the Metro stations workflow (run $GITHUB_RUN_ID). Data: Comune di Milano, CC BY 4.0 (dataset DS535)."
          git push origin data/metro-stations
          {
            echo ''
            echo "Pushed to **data/metro-stations**. Open its pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...data/metro-stations?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
