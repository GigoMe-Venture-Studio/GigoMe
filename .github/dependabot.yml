# Weekly pull requests for dependency updates: npm packages and the GitHub
# Actions used in .github/workflows. Each one runs the tests (tests.yml), so
# a red check means the update breaks something: don't merge it.
#
# For both: minor and patch updates come grouped in one PR per ecosystem.
# Every major update gets its own PR (it isn't in any group), since those
# are the ones that can break things and need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
